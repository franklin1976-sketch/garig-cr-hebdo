name: APK Android

# Se déclenche à la main (onglet Actions → « Run workflow »)
# ou automatiquement quand vous poussez une étiquette de version (v1.0.0, v1.1.0…).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Le SDK Android est déjà présent sur le runner ; cette action ne fait qu'accepter
      # les licences. Si elle échoue (elle date de Node 20), la compilation continue.
      - name: SDK Android
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Vérifier l'environnement
        run: |
          echo "node    : $(node -v)"
          echo "java    : $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME = ${ANDROID_HOME:-non défini}"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT:-non défini}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
          echo "Fichiers à la racine du dépôt :"
          ls -la

      - name: Préparer le dossier web
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html est introuvable à la racine du dépôt. Déposez-le avec Add file → Upload files, à la racine (pas dans un sous-dossier)." >&2
            ls -la
            exit 1
          fi
          mkdir -p www
          cp index.html www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; else echo "::warning::manifest.webmanifest absent du dépôt"; fi
          if [ -f sw.js ]; then cp sw.js www/; else echo "::warning::sw.js absent du dépôt"; fi
          if [ -d icons ]; then cp -r icons www/; else echo "::warning::dossier icons absent du dépôt"; fi
          echo "Contenu de www :"
          ls -la www

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      # Module d'envoi e-mail : destinataires ET pièces jointes dans la même intention.
      # S'il est absent, l'application retombe toute seule sur la feuille de partage.
      - name: Ajouter le module d'envoi e-mail
        run: |
          if [ ! -d android-natif ]; then
            echo "::warning::Dossier android-natif absent : l'application utilisera la feuille de partage ordinaire."
            exit 0
          fi
          pkg="android/app/src/main/java/fr/garig/crhebdo"
          mkdir -p "$pkg" android/app/src/main/res/xml
          cp android-natif/EnvoiEmailPlugin.java "$pkg/"
          cp android-natif/MainActivity.java "$pkg/"
          cp android-natif/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          echo "Contenu de $pkg :"
          ls -la "$pkg"

      - name: Icônes et écran de démarrage
        run: |
          if [ -d assets ]; then
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "::warning::Dossier assets absent : l'APK utilisera l'icône Capacitor par défaut."
          fi

      - name: Synchroniser
        run: npx cap sync android

      - name: Écrire la clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent — voir APK.md" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/garig.keystore"

      - name: Compiler l'APK signé
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/garig.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Compiler le bundle AAB pour le Play Store
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/garig.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Renommer les fichiers
        run: |
          mkdir -p sortie
          v="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/*.apk "sortie/garig-cr-hebdo-$v.apk"
          cp android/app/build/outputs/bundle/release/*.aab "sortie/garig-cr-hebdo-$v.aab"
          ls -la sortie

      - name: Empreinte SHA-256 de la clé (pour assetlinks.json)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$GITHUB_WORKSPACE/garig.keystore" \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -i "SHA256:" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: garig-cr-hebdo-apk
          path: sortie/*
          retention-days: 90

      - name: Joindre l'APK à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie/*
