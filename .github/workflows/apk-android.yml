name: APK Android

# Se déclenche à la main (onglet Actions → « Run workflow »)
# ou automatiquement quand vous poussez une étiquette de version (v1.0.0, v1.1.0…).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Préparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; else echo "::warning::manifest.webmanifest absent du dépôt"; fi
          if [ -f sw.js ]; then cp sw.js www/; else echo "::warning::sw.js absent du dépôt"; fi
          if [ -d icons ]; then cp -r icons www/; else echo "::warning::dossier icons absent du dépôt"; fi
          echo "Contenu de www :"
          ls -la www

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes et écran de démarrage
        run: |
          if [ -d assets ]; then
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "::warning::Dossier assets absent : l'APK utilisera l'icône Capacitor par défaut."
          fi

      - name: Synchroniser
        run: npx cap sync android

      - name: Écrire la clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent — voir APK.md" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/garig.keystore"

      - name: Compiler l'APK signé
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/garig.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Renommer le fichier
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/release/*.apk \
             "sortie/garig-cr-hebdo-${GITHUB_REF_NAME//\//-}.apk"
          ls -la sortie

      - name: Empreinte SHA-256 de la clé (pour assetlinks.json)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$GITHUB_WORKSPACE/garig.keystore" \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -i "SHA256:" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: garig-cr-hebdo-apk
          path: sortie/*.apk
          retention-days: 90

      - name: Joindre l'APK à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie/*.apk
